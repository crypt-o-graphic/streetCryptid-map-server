{{- if .Values.tiles.bake.enabled }}
{{- $b := .Values.tiles.bake }}
{{- $tag := $b.image.tag | default .Values.image.tag | default .Chart.AppVersion }}
{{- if and (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" $tag) (ne $tag .Chart.AppVersion) }}
{{- fail "tiles.bake.image.tag must match chart appVersion; wait for the matching release images before upgrading" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "scms.fullname" . }}-bake
  labels:
    {{- include "scms.labels" . | nindent 4 }}
spec:
  suspend: {{ $b.suspend }}
  schedule: {{ $b.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: {{ $b.backoffLimit }}
      activeDeadlineSeconds: {{ $b.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "scms.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: bake
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 60
          nodeSelector:
            kubernetes.io/hostname: {{ $b.nodeName | quote }}
          {{- with $b.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          # No serving-volume mount: a destination-volume fault cannot delete
          # the expensive builder during Longhorn's remount recovery.
          containers:
            - name: planetiler
              image: "{{ $b.image.repository }}:{{ $b.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ $b.image.pullPolicy }}
              args:
                - "build"
                - "--download"
                - "--area={{ $b.area }}"
                {{- with $b.osmURL }}
                - {{ printf "--osm_url=%s" . | quote }}
                {{- end }}
                - "--minzoom={{ $b.minZoom }}"
                - "--maxzoom={{ $b.maxZoom }}"
                {{- if $b.languages }}
                - "--languages={{ $b.languages }}"
                {{- end }}
                - "--threads={{ $b.threads }}"
                - "--download-max-bandwidth={{ $b.downloadMaxBandwidth }}"
                {{- if $b.lowMemory }}
                - "--storage=mmap"
                - "--nodemap-type=sparsearray"
                - "--nodemap-storage=mmap"
                {{- end }}
                {{- range $b.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              env:
                - name: JAVA_TOOL_OPTIONS
                  value: "-Xmx{{ $b.xmx }}"
                - name: BAKE_RUN_ID
                  {{- if $b.runID }}
                  value: {{ $b.runID | quote }}
                  {{- else }}
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/job-name']
                  {{- end }}
                - name: BAKE_WORKDIR
                  value: /scratch
                {{- include "scms.bakeS3Env" . | nindent 16 }}
              envFrom:
                - secretRef:
                    name: {{ required "tiles.bake.s3.credentialsSecret is required for resumable bakes" $b.s3.credentialsSecret | quote }}
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml $b.resources | nindent 16 }}
          volumes:
            - name: scratch
              persistentVolumeClaim:
                claimName: {{ include "scms.fullname" . }}-bake-scratch
{{- end }}
